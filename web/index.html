<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoIntern-Agent</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --text: #1a1a1a;
    --muted: #8a8a8a;
    --accent: #2f6b4f;
    --user-bg: #e8f0ec;
    --border: #e5e5e0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  header h1 { font-size: 18px; font-weight: 650; color: var(--accent); }
  header span { font-size: 13px; color: var(--muted); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .msg { max-width: 760px; width: 100%; }
  .msg.user { align-self: flex-end; }
  .msg .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .msg.user .label { text-align: right; }
  .msg .bubble {
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.65;
    font-size: 15px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.ai .bubble { background: var(--panel); border: 1px solid var(--border); }
  .msg.user .bubble { background: var(--user-bg); }
  .cursor {
    display: inline-block;
    width: 8px; height: 16px;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: -2px;
    animation: blink 0.9s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .err { color: #c0392b; font-size: 14px; }
  #input-area {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }
  #input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    resize: none;
    height: 52px;
    outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 22px;
    height: 52px;
    font-size: 15px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }
  /* markdown 渲染样式 */
  .bubble table { border-collapse: collapse; margin: 8px 0; width: 100%; display: block; overflow-x: auto; }
  .bubble table th, .bubble table td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; font-size: 14px; }
  .bubble table th { background: #f0f0ee; font-weight: 650; }
  .bubble h1, .bubble h2, .bubble h3, .bubble h4 { margin: 12px 0 6px; font-weight: 650; line-height: 1.4; }
  .bubble h1 { font-size: 19px; } .bubble h2 { font-size: 17px; } .bubble h3 { font-size: 16px; } .bubble h4 { font-size: 15px; }
  .bubble strong { font-weight: 650; }
  .bubble code { background: #f0f0ee; padding: 1px 5px; border-radius: 4px; font-size: 13px; font-family: "SF Mono", Consolas, monospace; }
  .bubble pre { background: #f5f5f3; padding: 10px 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
  .bubble pre code { background: none; padding: 0; }
  .bubble ul, .bubble ol { padding-left: 22px; margin: 6px 0; }
  .bubble li { margin: 3px 0; }
  .bubble p { margin: 6px 0; }
  .bubble blockquote { border-left: 3px solid var(--accent); padding-left: 10px; color: var(--muted); margin: 8px 0; }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  #img-btn { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; width: 52px; height: 52px; font-size: 16px; cursor: pointer; flex-shrink: 0; color: var(--accent); }
  #img-bar { display: flex; align-items: center; gap: 10px; padding: 0 24px 8px; background: var(--bg); }
  #img-clear { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; cursor: pointer; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>GeoIntern-Agent</h1>
  <span>野外地质实习助手</span>
</header>
<div id="messages"></div>
<div id="img-bar" style="display:none">
  <img id="img-thumb" style="max-height:90px; border-radius:8px; border:1px solid var(--border);">
  <button id="img-clear">移除图片</button>
</div>
<div id="input-area">
  <button id="img-btn" title="上传图片">图</button>
  <input type="file" id="img-input" accept="image/*" style="display:none">
  <textarea id="input" placeholder="问点什么：这块是白云岩还是灰岩？" rows="2"></textarea>
  <button id="send">发送</button>
</div>
<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendEl = document.getElementById('send');
  let history = [];
  let currentImage = null;

  const imgBtn = document.getElementById('img-btn');
  const imgInput = document.getElementById('img-input');
  const imgBar = document.getElementById('img-bar');
  const imgThumb = document.getElementById('img-thumb');
  const imgClear = document.getElementById('img-clear');

  imgBtn.addEventListener('click', () => imgInput.click());
  imgInput.addEventListener('change', () => {
    const file = imgInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        // 压缩：最长边 1024px，转 JPEG 质量 0.75，控制在 ~200KB
        const MAX = 1024;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          const s = MAX / Math.max(w, h);
          w = Math.round(w * s);
          h = Math.round(h * s);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        currentImage = canvas.toDataURL('image/jpeg', 0.75);
        imgThumb.src = currentImage;
        imgBar.style.display = 'flex';
      };
      img.onerror = () => {
        // 浏览器解不了码（如 HEIC），退回原图
        currentImage = reader.result;
        imgThumb.src = currentImage;
        imgBar.style.display = 'flex';
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
  imgClear.addEventListener('click', () => {
    currentImage = null;
    imgInput.value = '';
    imgBar.style.display = 'none';
  });

  function renderMarkdown(text) {
    if (typeof marked !== 'undefined' && marked.parse) {
      return marked.parse(text);
    }
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function addMsg(role, label) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.innerHTML = '<div class="label">' + label + '</div><div class="bubble"></div>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div.querySelector('.bubble');
  }

  function send() {
    const text = inputEl.value.trim();
    if (!text && !currentImage) return;
    const userBubble = addMsg('user', '你');
    if (currentImage) {
      const img = document.createElement('img');
      img.src = currentImage;
      img.style.maxWidth = '200px';
      img.style.borderRadius = '8px';
      img.style.display = 'block';
      img.style.marginBottom = '6px';
      userBubble.appendChild(img);
    }
    if (text) {
      const span = document.createElement('span');
      span.textContent = text;
      userBubble.appendChild(span);
    }
    history.push({ role: 'user', content: text });
    inputEl.value = '';
    sendEl.disabled = true;
    const payloadImages = currentImage ? [currentImage] : [];
    currentImage = null;
    imgInput.value = '';
    imgBar.style.display = 'none';

    const aiBubble = addMsg('ai', 'GeoIntern');
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    aiBubble.appendChild(cursor);

    fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history, images: payloadImages })
    }).then(async (resp) => {
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let full = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split('\n\n');
        buffer = parts.pop();
        for (const part of parts) {
          const line = part.trim();
          if (!line.startsWith('data:')) continue;
          const data = line.slice(5).trim();
          if (data === '[DONE]') continue;
          try {
            const obj = JSON.parse(data);
            if (obj.content) {
              full += obj.content;
              aiBubble.innerHTML = renderMarkdown(full);
              aiBubble.appendChild(cursor);
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
            if (obj.error) {
              aiBubble.innerHTML = '<span class="err">出错了：' + obj.error + '</span>';
            }
          } catch (e) {}
        }
      }
      history.push({ role: 'assistant', content: full });
      cursor.remove();
      sendEl.disabled = false;
      inputEl.focus();
    }).catch((e) => {
      aiBubble.innerHTML = '<span class="err">请求失败：' + e + '</span>';
      cursor.remove();
      sendEl.disabled = false;
    });
  }

  sendEl.addEventListener('click', send);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  addMsg('ai', 'GeoIntern').textContent = '我是野外地质实习助手。拍岩石、判构造、看地层、写野簿，有什么问题需要我解答吗？';
</script>
</body>
</html>
