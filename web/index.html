<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoIntern-Agent</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --text: #1a1a1a;
    --muted: #8a8a8a;
    --accent: #2f6b4f;
    --user-bg: #e8f0ec;
    --border: #e5e5e0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  header h1 { font-size: 18px; font-weight: 650; color: var(--accent); }
  header span { font-size: 13px; color: var(--muted); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .msg { max-width: 760px; width: 100%; }
  .msg.user { align-self: flex-end; }
  .msg .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .msg.user .label { text-align: right; }
  .msg .bubble {
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.65;
    font-size: 15px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.ai .bubble { background: var(--panel); border: 1px solid var(--border); }
  .msg.user .bubble { background: var(--user-bg); }
  .cursor {
    display: inline-block;
    width: 8px; height: 16px;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: -2px;
    animation: blink 0.9s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .err { color: #c0392b; font-size: 14px; }
  #input-area {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }
  #input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    resize: none;
    height: 52px;
    outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 22px;
    height: 52px;
    font-size: 15px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>GeoIntern-Agent</h1>
  <span>野外地质实习助手</span>
</header>
<div id="messages"></div>
<div id="input-area">
  <textarea id="input" placeholder="问点什么：这块是白云岩还是灰岩？" rows="2"></textarea>
  <button id="send">发送</button>
</div>
<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendEl = document.getElementById('send');
  let history = [];

  function addMsg(role, label) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.innerHTML = '<div class="label">' + label + '</div><div class="bubble"></div>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div.querySelector('.bubble');
  }

  function send() {
    const text = inputEl.value.trim();
    if (!text) return;
    const userBubble = addMsg('user', '你');
    userBubble.textContent = text;
    history.push({ role: 'user', content: text });
    inputEl.value = '';
    sendEl.disabled = true;

    const aiBubble = addMsg('ai', 'GeoIntern');
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    aiBubble.appendChild(cursor);

    fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    }).then(async (resp) => {
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let full = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split('\n\n');
        buffer = parts.pop();
        for (const part of parts) {
          const line = part.trim();
          if (!line.startsWith('data:')) continue;
          const data = line.slice(5).trim();
          if (data === '[DONE]') continue;
          try {
            const obj = JSON.parse(data);
            if (obj.content) {
              full += obj.content;
              aiBubble.textContent = full;
              aiBubble.appendChild(cursor);
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
            if (obj.error) {
              aiBubble.innerHTML = '<span class="err">出错了：' + obj.error + '</span>';
            }
          } catch (e) {}
        }
      }
      history.push({ role: 'assistant', content: full });
      cursor.remove();
      sendEl.disabled = false;
      inputEl.focus();
    }).catch((e) => {
      aiBubble.innerHTML = '<span class="err">请求失败：' + e + '</span>';
      cursor.remove();
      sendEl.disabled = false;
    });
  }

  sendEl.addEventListener('click', send);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  addMsg('ai', 'GeoIntern').textContent = '我是野外地质实习助手。拍岩石、判构造、看地层、写野簿，有什么问题需要我解答吗？';
</script>
</body>
</html>
